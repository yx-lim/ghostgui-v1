[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostgui"
version = "0.1.0"
description = "A MuJoCo-based GUI for editing robot reference-frame and state trajectories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "PyOpenGL",
    "numpy",
    "mujoco",
]

[project.scripts]
ghostgui = "application.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "application*",
    "core*",
    "gui*",
]
exclude = [
    "tests*",
]
