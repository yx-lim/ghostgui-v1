name: Live AI Provider Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider contract to test
        required: true
        default: gemini
        type: choice
        options:
          - gemini
          - anthropic
      model:
        description: Optional model override
        required: false
        type: string
      suite:
        description: contract (provider adapter) or agent (command-bar loop, Anthropic only)
        required: true
        default: contract
        type: choice
        options:
          - contract
          - agent
      max_cost_usd:
        description: Spend cap for the agent suite
        required: false
        default: "0.50"
        type: string

permissions:
  contents: read

jobs:
  live-provider-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AI_SMOKE_PROVIDER: ${{ inputs.provider }}
      AI_SMOKE_MODEL: ${{ inputs.model }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install AI provider adapters
        run: python -m pip install '.[ai]'

      - name: Run four-request live contract smoke
        if: ${{ inputs.suite == 'contract' }}
        shell: bash
        run: |
          arguments=("$AI_SMOKE_PROVIDER")
          if [[ -n "$AI_SMOKE_MODEL" ]]; then
            arguments+=(--model "$AI_SMOKE_MODEL")
          fi
          python scripts/smoke_ai_provider.py "${arguments[@]}"

      - name: Run command-bar agent loop smoke
        if: ${{ inputs.suite == 'agent' }}
        shell: bash
        env:
          AI_SMOKE_MAX_COST: ${{ inputs.max_cost_usd }}
        run: |
          python scripts/smoke_agent_loop.py --i-understand-this-spends \
            --max-cost-usd "$AI_SMOKE_MAX_COST" ${AI_SMOKE_MODEL:+--model "$AI_SMOKE_MODEL"}
